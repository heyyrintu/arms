# Owner approved a bounded trial on Ubuntu-1; resource caps live in the manager.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
EnableShutdownCommand no
StreamMaxLength 5M
MaxThreads 1
MaxQueue 2
ReadTimeout 15
CommandReadTimeout 5
ScanPDF yes
AlertEncrypted yes
AlertExceedsMax yes
MaxScanSize 30M
MaxFileSize 5M
MaxRecursion 10
MaxFiles 100
MaxScanTime 10000
FailIfCvdOlderThan 2
SelfCheck 600
LogClean no
LogVerbose no
ExtendedDetectionInfo no
GenerateMetadataJson no
LeaveTemporaryFiles no
ConcurrentDatabaseReload no
