Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 1
MaxQueue 2
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 12M
MaxRecursion 8
MaxFiles 20
ConcurrentDatabaseReload no
LogTime yes
